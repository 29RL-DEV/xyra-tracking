name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shipment_tracking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The test suite uses this instead of starting its own database.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shipment_tracking_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shipment_tracking_test
      SESSION_SECRET: ci-session-secret-that-is-at-least-32-characters

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on a critical advisory in a runtime dependency. Lower severities
      # are reviewed by hand rather than forcing a framework upgrade.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, service, API and component tests
        run: npm run test

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end journeys (desktop and mobile)
    runs-on: ubuntu-latest
    # Only worth running once the fast checks have passed.
    needs: verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shipment_tracking_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A local database, so the seed runs without the destructive-seed
      # override and uses the documented demo password.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shipment_tracking_e2e
      SESSION_SECRET: ci-session-secret-that-is-at-least-32-characters
      # Playwright targets the server started below instead of launching
      # `next dev`, whose on-demand compilation is too slow to test against.
      E2E_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply the schema
        run: npx prisma migrate deploy

      - name: Seed the demo data
        run: npm run db:seed

      - name: Production build
        run: npm run build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Start the application
        run: |
          nohup npm run start > server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Application is up"
              exit 0
            fi
            sleep 2
          done
          echo "Application did not start"
          cat server.log
          exit 1

      - name: End-to-end tests
        run: npx playwright test

      - name: Keep the report and server log when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            server.log
          retention-days: 7
